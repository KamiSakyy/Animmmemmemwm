plugins { id 'com.android.application' }

android {
 namespace 'app.tsuyu.mobile'
 compileSdk 36
 defaultConfig {
  applicationId 'app.tsuyu.mobile'
  minSdk 26
  targetSdk 36
  versionCode 1
  versionName '1.0.0'
 }
 signingConfigs { release { initWith signingConfigs.debug } }
 buildTypes {
  release { minifyEnabled true; shrinkResources true; debuggable false; signingConfig signingConfigs.release; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
  debug { applicationIdSuffix '.debug' }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { resources { excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE*','META-INF/NOTICE*','META-INF/INDEX.LIST'] } }
}

dependencies {
 implementation platform('com.google.firebase:firebase-bom:33.7.0')
 implementation 'com.google.firebase:firebase-auth'
 implementation 'com.google.firebase:firebase-database'
 implementation 'androidx.core:core:1.15.0'
 implementation 'androidx.recyclerview:recyclerview:1.4.0'
 implementation 'androidx.media3:media3-exoplayer:1.5.1'
 implementation 'androidx.media3:media3-ui:1.5.1'
}
