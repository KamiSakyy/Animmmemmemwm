plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }

def owner = new Properties()
def ownerFile = rootProject.file('owner-signing/signing.properties')
if (ownerFile.exists()) ownerFile.withInputStream { owner.load(it) }

android {
 namespace 'app.yoru.kotlin'
 compileSdk 36
 defaultConfig {
  applicationId 'app.yoru.kotlin'
  minSdk 26
  targetSdk 36
  versionCode 1
  versionName '1.0.0-kotlin'
 }
 signingConfigs { release {
  if (ownerFile.exists()) {
   storeFile rootProject.file('owner-signing/yoru-release.jks')
   storePassword owner.getProperty('storePassword')
   keyAlias owner.getProperty('keyAlias')
   keyPassword owner.getProperty('keyPassword')
  }
  enableV1Signing false
  enableV2Signing true
  enableV3Signing true
 } }
 buildTypes {
  release { minifyEnabled false; shrinkResources false; debuggable false; signingConfig signingConfigs.release }
  debug { applicationIdSuffix '.debug' }
 }
 buildFeatures { compose true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 packaging { resources { excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE*','META-INF/NOTICE*','META-INF/*.kotlin_module'] } }
}

dependencies {
 implementation platform('androidx.compose:compose-bom:2024.12.01')
 implementation 'androidx.activity:activity-compose:1.9.3'
 implementation 'androidx.compose.ui:ui'
 implementation 'androidx.compose.ui:ui-tooling-preview'
 implementation 'androidx.compose.foundation:foundation'
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.material:material-icons-extended'
 implementation 'androidx.navigation:navigation-compose:2.8.5'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
 implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
 implementation 'androidx.core:core-ktx:1.15.0'
 implementation 'io.coil-kt:coil-compose:2.7.0'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
 implementation 'androidx.media3:media3-exoplayer:1.5.1'
 implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
 implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
 implementation 'androidx.media3:media3-ui:1.5.1'
}
