plugins { id 'com.android.application' }
def ownerSignedApk = project.hasProperty('ownerSignedApk')
if (project.hasProperty('compactApk')) throw new GradleException('Compact builds are disabled; use ownerSignedApk')
def verificationBuild = project.hasProperty('verifyOnSdk36')
def jvmVerification = project.hasProperty('verifyJvmTransport')
def transportDependency = verificationBuild ? (jvmVerification ? 'com.squareup.okhttp3:okhttp-jvm:5.5.0' : 'com.squareup.okhttp3:okhttp:5.4.0') : 'com.squareup.okhttp3:okhttp:5.5.0'
if (verificationBuild && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) throw new GradleException('SDK36 verification cannot produce a release build')
def owner = new Properties()
def ownerFile = rootProject.file('owner-signing/signing.properties')
if (ownerSignedApk && !ownerFile.exists()) throw new GradleException('Owner signing configuration is required for distribution')
if (ownerFile.exists()) ownerFile.withInputStream { owner.load(it) }
def certHash = rootProject.file('owner-signing/certificate-sha256.txt').exists() ? rootProject.file('owner-signing/certificate-sha256.txt').text.trim() : ''
android {
 namespace 'app.yoru.mobile'
 compileSdk verificationBuild ? 36 : 37
 defaultConfig {
  applicationId 'app.yoru.mobile'
  minSdk 26
  targetSdk verificationBuild ? 36 : 37
  versionCode 79
  versionName verificationBuild ? (jvmVerification ? '4.20.0-dev.9-jvm-verification' : '4.20.0-restart.9') : '4.20.0-dev.9'
  resValue 'string', 'application_title', (verificationBuild ? 'YORU · проверка' : 'YORU')
  buildConfigField 'String', 'DISPLAY_VERSION', '"4.20.0' + (verificationBuild ? ' · тестовая' : '') + '"'
  buildConfigField 'String', 'EXPECTED_SIGNER_SHA256', '"' + certHash + '"'
  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
 }
 signingConfigs { release {
  if (ownerFile.exists()) {
   storeFile rootProject.file('owner-signing/yoru-release.jks')
   storePassword owner.getProperty('storePassword')
   keyAlias owner.getProperty('keyAlias')
   keyPassword owner.getProperty('keyPassword')
  }
  enableV1Signing false
  enableV2Signing true
  enableV3Signing true
 } }
 buildTypes {
  release { minifyEnabled false; shrinkResources false; debuggable false; signingConfig signingConfigs.release;  }
  debug {
   applicationIdSuffix '.debug'
   debuggable !ownerSignedApk
   if (ownerSignedApk) signingConfig signingConfigs.release
   minifyEnabled false
   shrinkResources false
   
  }
 }
 buildFeatures { buildConfig true; resValues true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 androidResources { noCompress += [''] }
 packaging { resources { excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE*','META-INF/NOTICE*'] }; jniLibs { useLegacyPackaging false } }
}

dependencies {
 testImplementation 'junit:junit:4.13.2'
 implementation transportDependency
 implementation('androidx.media3:media3-datasource-okhttp:1.5.1') { exclude group: 'com.squareup.okhttp3', module: 'okhttp' }
 implementation 'androidx.media3:media3-exoplayer:1.5.1'
 implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
 implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
 implementation 'androidx.media3:media3-ui:1.5.1'
 implementation 'androidx.media3:media3-database:1.5.1'
 implementation 'org.jsoup:jsoup:1.18.3'
 implementation 'androidx.annotation:annotation:1.9.1'
 implementation 'androidx.core:core:1.15.0'
 implementation 'androidx.work:work-runtime:2.10.1'
 implementation 'androidx.recyclerview:recyclerview:1.4.0'
 implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}


tasks.register('assembleStoredDebug') {
 dependsOn 'assembleDebug'
 doLast {
  if (!ownerSignedApk || !ownerFile.exists()) throw new GradleException('Distribution signing is required')
  def original = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk').get().asFile
  def work = layout.buildDirectory.dir('stored-apk').get().asFile
  work.mkdirs()
  def unsigned = new File(work, 'unsigned.apk')
  def aligned = new File(work, 'aligned.apk')
  new java.util.zip.ZipFile(original).withCloseable { input ->
   new java.util.zip.ZipOutputStream(new FileOutputStream(unsigned)).withCloseable { output ->
    input.entries().each { entry ->
     if (!entry.name.matches('(?i)META-INF/[^/]+\\.(SF|RSA|DSA|EC)') && !entry.name.equalsIgnoreCase('META-INF/MANIFEST.MF')) {
      def stored = new java.util.zip.ZipEntry(entry.name)
      stored.method = java.util.zip.ZipEntry.STORED
      stored.size = entry.size
      stored.compressedSize = entry.size
      stored.crc = entry.crc
      stored.time = entry.time
      output.putNextEntry(stored)
      input.getInputStream(entry).withCloseable { stream -> stream.transferTo(output) }
      output.closeEntry()
     }
    }
   }
  }
  def tools = new File(androidComponents.sdkComponents.sdkDirectory.get().asFile, 'build-tools/' + android.buildToolsVersion)
  providers.exec {
   commandLine new File(tools, 'zipalign').absolutePath, '-P', '16', '-f', '4', unsigned.absolutePath, aligned.absolutePath
  }.result.get().assertNormalExitValue()
  providers.exec {
   environment 'YORU_STORE_PASSWORD', owner.getProperty('storePassword')
   environment 'YORU_KEY_PASSWORD', owner.getProperty('keyPassword')
   commandLine new File(tools, 'apksigner').absolutePath, 'sign', '--ks', rootProject.file('owner-signing/yoru-release.jks').absolutePath, '--ks-key-alias', owner.getProperty('keyAlias'), '--ks-pass', 'env:YORU_STORE_PASSWORD', '--key-pass', 'env:YORU_KEY_PASSWORD', '--v1-signing-enabled', 'false', '--v2-signing-enabled', 'true', '--v3-signing-enabled', 'true', '--out', original.absolutePath, aligned.absolutePath
  }.result.get().assertNormalExitValue()
  unsigned.delete()
  aligned.delete()
 }
}
