name: Build Tsuyu Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a07147-animmmemmemwm
    paths:
      - 'tsuyu-android/**'
      - '.github/workflows/build-tsuyu-apk.yml'

jobs:
  tsuyu-android-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: tsuyu-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            tsuyu-android/*.gradle
            tsuyu-android/**/*.gradle
            tsuyu-android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Create release signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tsuyu,O=Tsuyu,C=EE"
      - name: Build Tsuyu release APK
        run: |
          set +e
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee ../tsuyu-build-release.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "### Tsuyu release build failed"
              echo '```'
              tail -160 ../tsuyu-build-release.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            message=$(tail -60 ../tsuyu-build-release.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Tsuyu Gradle release build failed::$message"
            exit "$code"
          fi
      - name: Stage Tsuyu APK files
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p apk-output
          echo "Release outputs:"
          find tsuyu-android/app/build/outputs/apk/release -maxdepth 1 -type f -print -exec ls -lh {} \;
          APK="$(find tsuyu-android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" apk-output/Tsuyu-1.0.0-release.apk
          sha256sum apk-output/Tsuyu-1.0.0-release.apk > apk-output/Tsuyu-1.0.0-release.apk.sha256
      - name: Upload Tsuyu APK
        uses: actions/upload-artifact@v4
        with:
          name: Tsuyu-1.0.0-release-apk
          path: |
            apk-output/Tsuyu-1.0.0-release.apk
            apk-output/Tsuyu-1.0.0-release.apk.sha256
      - name: Save Tsuyu APK into branch
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin arena/01a07147-animmmemmemwm
          git add -f apk-output/Tsuyu-1.0.0-release.apk apk-output/Tsuyu-1.0.0-release.apk.sha256
          git commit -m "Add built Tsuyu 1.0.0 release APK [skip ci]" || exit 0
          git push origin HEAD:arena/01a07147-animmmemmemwm
