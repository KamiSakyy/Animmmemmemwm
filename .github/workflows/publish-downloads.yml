name: Publish YORU downloads
on:
  push:
    branches:
      - arena/01a0828d-animmmemmemwm
    paths:
      - handoff/YORU-4.20.0-dev.9-source.zip
permissions:
  contents: write
concurrency:
  group: yoru-downloads-${{ github.ref }}
  cancel-in-progress: false
jobs:
  downloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify matching APK and sources
        run: python3 tools/verify-yoru-delivery.py
      - name: Publish direct download assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=yoru-4.20.0-dev.9
          cp apk-output/YORU-4.20.0-dev.9-sdk36-okhttp5.4-unminified.apk "$RUNNER_TEMP/YORU-4.20.0-test.apk"
          cp handoff/YORU-4.20.0-dev.9-source.zip "$RUNNER_TEMP/YORU-4.20.0-source.zip"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "YORU 4.20.0 — основа dev.2 без минификации" --notes "Перезапуск с runtime-кода подтверждённой пользователем dev.2. Минификация и удаление ресурсов отключены, все записи APK сохранены без ZIP-сжатия. Прежняя подпись и повышенный номер позволяют обновление без удаления данных. Сохранена совместимость базы будущих загрузок. Новые функции dev.3–dev.7 не перенесены. Причина прежнего вылета не установлена; запуск этой сборки на телефоне пользователя ещё не подтверждён. Отдельные тестовые прогоны не выполнялись."
          fi
          gh release upload "$tag" "$RUNNER_TEMP/YORU-4.20.0-test.apk" "$RUNNER_TEMP/YORU-4.20.0-source.zip" --clobber
          gh release edit "$tag" --draft=false --prerelease
