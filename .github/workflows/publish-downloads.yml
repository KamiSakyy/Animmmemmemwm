name: Publish YORU downloads
on:
  push:
    branches:
      - arena/01a0828d-animmmemmemwm
    paths:
      - handoff/YORU-4.20.0-dev.10-source.zip
permissions:
  contents: write
concurrency:
  group: yoru-downloads-${{ github.ref }}
  cancel-in-progress: false
jobs:
  downloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify matching APK and sources
        run: python3 tools/verify-yoru-delivery.py
      - name: Publish direct download assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=yoru-4.20.0-dev.10
          cp apk-output/YORU-4.20.0-dev.10-sdk36-okhttp5.4-unminified.apk "$RUNNER_TEMP/YORU-4.20.0-test.apk"
          cp handoff/YORU-4.20.0-dev.10-source.zip "$RUNNER_TEMP/YORU-4.20.0-source.zip"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "YORU 4.20.0 — список серий" --notes "Продолжение подтверждённой пользователем рабочей dev.9. Список серий перенесён сразу под плеер, добавлены переход к списку и повторная загрузка. Полученный список сохраняется при обновлении описания; поздний ответ источника больше не отбрасывается коротким ожиданием метаданных. Выбор серии не запускает первую серию автоматически. Сохранено отключение минификации, удаления ресурсов и ZIP-сжатия APK. Кэш и палитра не менялись. Отдельные тестовые прогоны не выполнялись."
          fi
          gh release upload "$tag" "$RUNNER_TEMP/YORU-4.20.0-test.apk" "$RUNNER_TEMP/YORU-4.20.0-source.zip" --clobber
          gh release edit "$tag" --draft=false --prerelease
