name: Publish YORU downloads
on:
  push:
    branches:
      - arena/01a0828d-animmmemmemwm
    paths:
      - handoff/YORU-4.20.0-dev.8-source.zip
permissions:
  contents: write
concurrency:
  group: yoru-downloads-${{ github.ref }}
  cancel-in-progress: false
jobs:
  downloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify matching APK and sources
        run: python3 tools/verify-yoru-delivery.py
      - name: Publish direct download assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=yoru-4.20.0-dev.8
          cp apk-output/YORU-4.20.0-dev.8-compat-sdk36-okhttp5.4.apk "$RUNNER_TEMP/YORU-4.20.0-test.apk"
          cp handoff/YORU-4.20.0-dev.8-source.zip "$RUNNER_TEMP/YORU-4.20.0-source.zip"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "YORU 4.20.0 — восстановление рабочей dev.2" --notes "Восстановительная сборка на исходниках dev.2, которую пользователь подтвердил рабочей. Версия повышена для обновления поверх dev.3–dev.7 без удаления приложения. Сохранена совместимость базы будущих загрузок. Изменения dev.3–dev.7 временно исключены из APK. Это возврат к известной рабочей основе, не доказательство установленной причины вылета. Отдельные тестовые прогоны не выполнялись; запуск на телефоне пользователя ещё не подтверждён."
          fi
          gh release upload "$tag" "$RUNNER_TEMP/YORU-4.20.0-test.apk" "$RUNNER_TEMP/YORU-4.20.0-source.zip" --clobber
          gh release edit "$tag" --draft=false --prerelease
