name: Publish YORU downloads
on:
  workflow_dispatch:
    inputs:
      final_delivery:
        description: 'Publish the completed major update with matching APK and sources'
        type: boolean
        default: false
        required: true
permissions:
  contents: write
concurrency:
  group: yoru-downloads-${{ github.ref }}
  cancel-in-progress: false
jobs:
  downloads:
    if: github.ref == 'refs/heads/arena/01a0828d-animmmemmemwm' && inputs.final_delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify matching APK and sources
        run: python3 tools/verify-yoru-delivery.py
      - name: Publish direct download assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=yoru-4.20.0-dev.11
          cp apk-output/YORU-4.20.0-dev.11-sdk36-okhttp5.4-unminified.apk "$RUNNER_TEMP/YORU-4.20.0-test.apk"
          cp handoff/YORU-4.20.0-dev.11-source.zip "$RUNNER_TEMP/YORU-4.20.0-source.zip"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "YORU 4.20.0 — объединённое обновление" --notes "Объединённое обновление от рабочей основы dev.9 с сохранением списка серий dev.10: озвучки и разрешение, сезоны, обновление главной и каталога, жанры, обои, расписание и сохранение в выбранную папку. Минификация, удаление ресурсов и ZIP-сжатие APK отключены. Код запуска Application и политики кэша не менялись. Экспорт совместимых адаптивных загрузок переносит видео и звук без перекодирования; отдельные субтитры не переносятся. SDK37, статистика просмотров озвучек Shikimori и точные размеры неизвестных потоков не объявляются выполненными. Отдельные тестовые прогоны не выполнялись, поведение новой сборки на телефоне ещё не подтверждено."
          fi
          gh release upload "$tag" "$RUNNER_TEMP/YORU-4.20.0-test.apk" "$RUNNER_TEMP/YORU-4.20.0-source.zip" --clobber
          gh release edit "$tag" --draft=false --prerelease
