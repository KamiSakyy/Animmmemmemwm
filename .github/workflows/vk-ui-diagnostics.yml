name: Read VK Android smoke diagnostics
on:
  push:
    branches: [arena/01a0828d-animmmemmemwm]
    paths: ['.github/workflows/vk-ui-diagnostics.yml']
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: yoru-vk-0.2.1-prototype
          run-id: 34320934476
          github-token: ${{ github.token }}
          path: workspace-output/previous-smoke
      - run: |
          cp workspace-output/previous-smoke/vk-ui-last.xml handoff/YORU-VK-0.2.1-ui-diagnostic.xml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add handoff/YORU-VK-0.2.1-ui-diagnostic.xml
          git commit -m 'Preserve public guest Android UI diagnostics [skip ci]'
          git pull --rebase --strategy-option=theirs origin arena/01a0828d-animmmemmemwm
          git push origin HEAD:arena/01a0828d-animmmemmemwm
