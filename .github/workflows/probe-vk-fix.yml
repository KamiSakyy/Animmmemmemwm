name: Verify repaired catalog and VK search
on:
  workflow_dispatch:
  push:
    branches: [arena/01a0828d-animmmemmemwm]
    paths: ['tools/probe-vk-fix.py', '.github/workflows/probe-vk-fix.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - run: python tools/probe-vk-fix.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add handoff/YORU-VK-0.2.1-search-probe.json
          git commit -m 'Save public token-free VK web research [skip ci]' || exit 0
          git pull --rebase --strategy-option=theirs origin arena/01a0828d-animmmemmemwm
          git push origin HEAD:arena/01a0828d-animmmemmemwm
