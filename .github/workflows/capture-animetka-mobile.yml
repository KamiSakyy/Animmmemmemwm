name: Capture mobile dark Animetka research

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0828d-animmmemmemwm
    paths:
      - 'tools/capture-animetka-mobile.py'
      - '.github/workflows/capture-animetka-mobile.yml'

permissions:
  contents: write

concurrency:
  group: animetka-mobile-dark
  cancel-in-progress: false

jobs:
  public-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install capture browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Capture public design files
        run: python tools/capture-animetka-mobile.py
      - name: Verify and save snapshot
        run: |
          sha256sum -c handoff/ANIMETKA-mobile-dark-2026-09-09.zip.sha256
          python -m zipfile -t handoff/ANIMETKA-mobile-dark-2026-09-09.zip
          git pull --rebase origin arena/01a0828d-animmmemmemwm
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add handoff/ANIMETKA-mobile-dark-2026-09-09.zip handoff/ANIMETKA-mobile-dark-2026-09-09.zip.sha256 handoff/ANIMETKA-mobile-dark-summary.json
          git commit -m 'Save public Animetka frontend research snapshot [skip ci]' || exit 0
          git push origin HEAD:arena/01a0828d-animmmemmemwm
      - name: Upload capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animetka-mobile-dark-capture
          path: |
            handoff/ANIMETKA-mobile-dark-2026-09-09.zip
            handoff/ANIMETKA-mobile-dark-2026-09-09.zip.sha256
            handoff/ANIMETKA-mobile-dark-summary.json
            workspace-output/animetka-mobile-dark/
          if-no-files-found: ignore
