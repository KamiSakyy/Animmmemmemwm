name: Build Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0828d-animmmemmemwm
    paths:
      - 'yoru-android/app/**'
      - 'yoru-android/settings.gradle'
      - 'yoru-android/build.gradle'
      - 'yoru-android/gradle.properties'
      - 'yoru-android/gradle/**'
      - 'yoru-android/gradlew'
      - 'yoru-android/gradlew.bat'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: yoru-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: yoru-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            yoru-android/*.gradle
            yoru-android/**/*.gradle
            yoru-android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v3
      - name: Restore Android SDK cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-37
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/platform-tools
          key: yoru-android-sdk-37-36.0.0-${{ runner.os }}
      - name: Install missing Android SDK components
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ] || [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            sdkmanager --list --channel=3 | grep -E 'android-(37|Cinnamon)|build-tools;37' >> "$GITHUB_STEP_SUMMARY" || true
            if ! sdkmanager --channel=3 "platforms;android-37" "build-tools;36.0.0" "platform-tools" > sdk-install.log 2>&1; then
              cat sdk-install.log >> "$GITHUB_STEP_SUMMARY"
              message=$(tr '\r' '\n' < sdk-install.log | grep -E 'Warning:|Error:|Failed|not found' | tail -5 | tr '\n' ' ')
              echo "::error title=SDK 37 installation::$message"
              exit 1
            fi
          else
            echo "Android SDK 37 already restored"
          fi
      - name: Restore release signing files
        working-directory: .
        run: unzip -o YORU-android-2.0.1-source.zip 'yoru-android/owner-signing/*'
      - name: Build Java release APK
        run: |
          set +e
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease 2>&1 | tee ../build-release.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "### Java release build failed"
              echo '```'
              tail -120 ../build-release.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            message=$(tail -40 ../build-release.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle Java release build failed::$message"
            exit "$code"
          fi
      - name: Verify APK signatures
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - name: Save APK into branch
        working-directory: .
        run: |
          git pull --rebase origin arena/01a0828d-animmmemmemwm
          mkdir -p apk-output
          rm -f apk-output/YORU-4.20.0-dev.1-release.apk apk-output/YORU-4.20.0-dev.1-release.apk.sha256
          cp yoru-android/app/build/outputs/apk/release/app-release.apk apk-output/YORU-4.20.0-dev.1-release.apk
          sha256sum apk-output/YORU-4.20.0-dev.1-release.apk > apk-output/YORU-4.20.0-dev.1-release.apk.sha256
          cp yoru-android/app/build/outputs/apk/debug/app-debug.apk apk-output/YORU-4.20.0-dev.1-debug.apk
          sha256sum apk-output/YORU-4.20.0-dev.1-debug.apk > apk-output/YORU-4.20.0-dev.1-debug.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk-output/YORU-4.20.0-dev.1-*.apk apk-output/YORU-4.20.0-dev.1-*.apk.sha256
          git commit -m "Add built YORU 4.20.0-dev.1 release APK [skip ci]" || exit 0
          git push origin HEAD:arena/01a0828d-animmmemmemwm
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yoru-4.20.0-dev.1-release-apk
          path: |
            apk-output/YORU-4.20.0-dev.1-*.apk
            apk-output/YORU-4.20.0-dev.1-*.apk.sha256

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoru-4.20.0-dev.1-tests
          path: yoru-android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

  compatibility-verification:
    name: Java and unit verification on SDK36 (not release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install verification SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Java and run unit tests without publishing APK
        working-directory: yoru-android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon -PverifyOnSdk36 :app:testDebugUnitTest :app:assembleDebug > verification.log 2>&1
          code=$?
          tail -100 verification.log >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            message=$(tail -70 verification.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=SDK36 compatibility verification::$message"
          fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yoru-4.20.0-dev.1-sdk36-verification
          path: |
            yoru-android/verification.log
            yoru-android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
