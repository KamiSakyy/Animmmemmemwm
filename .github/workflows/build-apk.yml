name: Build Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a07147-animmmemmemwm

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yoru-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Save APK into branch
        working-directory: .
        run: |
          mkdir -p apk-output
          cp yoru-android/app/build/outputs/apk/debug/app-debug.apk apk-output/YORU-2.1.0-debug.apk
          sha256sum apk-output/YORU-2.1.0-debug.apk > apk-output/YORU-2.1.0-debug.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk-output/YORU-2.1.0-debug.apk apk-output/YORU-2.1.0-debug.apk.sha256
          git commit -m "Add built YORU debug APK [skip ci]" || exit 0
          git push origin HEAD:arena/01a07147-animmmemmemwm
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yoru-2.1.0-debug-apk
          path: apk-output/*.apk
