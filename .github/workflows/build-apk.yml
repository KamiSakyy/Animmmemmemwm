name: Assemble YORU major update
on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0a14a-animmmemmemwm
    paths:
      - 'yoru-android/**'
      - 'tools/package-yoru-major.py'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
concurrency:
  group: yoru-final-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assemble:
    if: github.ref == 'refs/heads/arena/01a0a14a-animmmemmemwm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line tools
        run: |
          set -e
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Install unchanged build profile dependencies
        run: |
          set -e
          yes 2>/dev/null | sdkmanager --licenses --sdk_root="$ANDROID_SDK_ROOT" >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Restore existing update signature
        run: unzip -oq YORU-android-2.0.1-source.zip 'yoru-android/owner-signing/*'
      - name: Assemble final APK without test runs
        working-directory: yoru-android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon -PverifyOnSdk36 -PownerSignedApk :app:assembleStoredDebug 2>&1 | tee android-final-build.log
      - name: Package matching APK and sources
        run: python3 tools/package-yoru-major.py
      - name: Publish final APK and sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd workspace-output/yoru-final
          gh release delete yoru-4.35.0 --yes --cleanup-tag || true
          gh release create yoru-4.35.0 --target "$GITHUB_SHA" --title "YORU 4.35.0" --notes "Финальная сборка объединённого обновления YORU 4.35.0 (code 97)." YORU-4.35.0.apk YORU-4.35.0.apk.sha256 YORU-4.35.0-source.zip YORU-4.35.0-source.zip.sha256 BUILD-RECEIPT.json
      - name: Preserve final APK in repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p apk-output
          cp workspace-output/yoru-final/YORU-4.35.0.apk apk-output/YORU-4.35.0-release.apk
          cp workspace-output/yoru-final/YORU-4.35.0.apk.sha256 apk-output/YORU-4.35.0-release.apk.sha256
          cp workspace-output/yoru-final/YORU-4.35.0-source.zip apk-output/YORU-4.35.0-source.zip
          cp workspace-output/yoru-final/YORU-4.35.0-source.zip.sha256 apk-output/YORU-4.35.0-source.zip.sha256
          cp workspace-output/yoru-final/BUILD-RECEIPT.json apk-output/YORU-4.35.0-BUILD-RECEIPT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk-output
          git commit -m "Preserve final YORU 4.35.0 APK and sources"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: yoru-4.35.0-final
          path: workspace-output/yoru-final/*
          compression-level: 0
          if-no-files-found: error
      - name: Store build diagnostics in repository
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-logs
          { grep -nE "error:|FAILED|What went wrong:|\.java:[0-9]+" yoru-android/android-final-build.log | head -80 || true; } > ci-logs/last-failure.txt
          echo "----- tail -----" >> ci-logs/last-failure.txt
          tail -n 120 yoru-android/android-final-build.log >> ci-logs/last-failure.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-logs/last-failure.txt
          git commit -m "Build diagnostics for run ${GITHUB_RUN_ID}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: yoru-final-build-diagnostics
          path: yoru-android/android-final-build.log
          if-no-files-found: ignore
